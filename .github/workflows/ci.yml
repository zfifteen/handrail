name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check tracked text uses LF line endings
        run: |
          if LC_ALL=C git grep -I -n $'\r' -- .; then
            echo "CRLF line endings found in tracked text files."
            exit 1
          fi

  cli-tests:
    name: CLI tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        run: npm ci

      - name: Run CLI tests
        run: npm test

  ios-simulator-build:
    name: iOS simulator app and test build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Handrail app and tests for iOS Simulator
        run: |
          xcodebuild \
            -project ios/Handrail/Handrail.xcodeproj \
            -scheme Handrail \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
